
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f6ff">
<title>Creator Hub ♡ — твоя территория идей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
--ink:#28243a;
--muted:#777287;
--purple:#8065d9;
--purple-dark:#684bc5;
--lavender:#eee9ff;
--lavender-2:#f5f2ff;
--cream:#fbfaff;
--white:#fff;
--line:#e9e4f5;
--shadow:0 18px 55px rgba(81,61,137,.10);
}

* {box-sizing:border-box}
html {scroll-behavior:smooth}
body {
margin:0;
background:var(--cream);
color:var(--ink);
font-family:"DM Sans",sans-serif;
line-height:1.6;
}
a {color:inherit;text-decoration:none}
button,select {font:inherit}
.wrap {width:min(1120px,calc(100% - 40px));margin:auto}

.topbar {
position:sticky;
top:0;
z-index:10;
background:rgba(251,250,255,.9);
backdrop-filter:blur(16px);
border-bottom:1px solid var(--line);
}

.nav {
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
gap:24px;
}

.logo {
font:800 22px Manrope,sans-serif;
letter-spacing:-1px;
}
.logo span {color:var(--purple)}

.navlinks {
display:flex;
gap:27px;
color:#625d72;
font-size:14px;
font-weight:600;
}

.navlinks a:hover {color:var(--purple)}

.btn {
display:inline-flex;
align-items:center;
justify-content:center;
gap:9px;
padding:13px 20px;
border:0;
border-radius:14px;
background:var(--purple);
color:white;
font-weight:700;
cursor:pointer;
box-shadow:0 9px 22px rgba(128,101,217,.22);
transition:.2s;
}

.btn:hover {
background:var(--purple-dark);
transform:translateY(-2px);
}

.btn.secondary {
background:white;
color:var(--purple);
border:1px solid var(--line);
box-shadow:none;
}

.hero {
padding:76px 0 65px;
overflow:hidden;
}

.hero-grid {
display:grid;
grid-template-columns:1.08fr .92fr;
align-items:center;
gap:45px;
}

.eyebrow {
display:inline-flex;
align-items:center;
gap:8px;
padding:8px 13px;
background:var(--lavender-2);
border:1px solid var(--line);
border-radius:99px;
color:var(--purple-dark);
font-size:12px;
font-weight:800;
}

h1,h2,h3 {
font-family:Manrope,sans-serif;
line-height:1.13;
letter-spacing:-1.2px;
}

h1 {
font-size:clamp(39px,5.2vw,62px);
margin:20px 0 18px;
}

h1 em {
font-style:normal;
color:var(--purple);
}

.hero p {
max-width:530px;
color:var(--muted);
font-size:17px;
margin:0 0 27px;
}

.hero-actions {
display:flex;
gap:12px;
flex-wrap:wrap;
}

.hero-note {
font-size:12px!important;
margin-top:17px!important;
}

.visual {
position:relative;
min-height:390px;
display:grid;
place-items:center;
}

.orb {
position:absolute;
width:330px;
height:330px;
border-radius:50%;
background:linear-gradient(145deg,#eee8ff,#faf4ff);
}

.idea-card {
position:relative;
width:min(390px,100%);
padding:25px;
background:white;
border:1px solid var(--line);
border-radius:27px;
box-shadow:var(--shadow);
transform:rotate(2deg);
}

.card-top {
display:flex;
justify-content:space-between;
align-items:center;
color:var(--muted);
font-size:12px;
font-weight:700;
}

.spark {
width:38px;
height:38px;
border-radius:13px;
background:var(--lavender);
display:grid;
place-items:center;
font-size:19px;
}

.idea-card h3 {
font-size:24px;
margin:18px 0 8px;
}

.idea-card p {
font-size:14px;
color:var(--muted);
margin:0;
}

.mini-tags {
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:20px;
}

.tag {
padding:7px 10px;
border-radius:9px;
background:var(--lavender-2);
color:var(--purple-dark);
font-size:11px;
font-weight:700;
}

.floating {
position:absolute;
background:#fff;
border:1px solid var(--line);
border-radius:15px;
padding:12px 15px;
box-shadow:var(--shadow);
font-size:12px;
font-weight:800;
}

.float-one {
top:34px;
right:0;
transform:rotate(5deg);
}

.float-two {
bottom:38px;
left:0;
transform:rotate(-5deg);
}

section {padding:65px 0}

.section-head {
text-align:center;
max-width:650px;
margin:0 auto 35px;
}

.section-head h2 {
font-size:clamp(29px,4vw,42px);
margin:12px 0;
}

.section-head p {
color:var(--muted);
margin:0;
}

.features {
display:grid;
grid-template-columns:repeat(3,1fr);
gap:17px;
}

.feature {
padding:24px;
background:#fff;
border:1px solid var(--line);
border-radius:21px;
box-shadow:0 8px 28px rgba(81,61,137,.045);
}

.feature-icon {
width:46px;
height:46px;
display:grid;
place-items:center;
border-radius:15px;
background:var(--lavender-2);
font-size:22px;
}

.feature h3 {
font-size:18px;
letter-spacing:-.4px;
margin:17px 0 8px;
}

.feature p {
font-size:13px;
color:var(--muted);
margin:0;
}

.generator-section {
background:linear-gradient(180deg,#f5f1ff 0%,#fbfaff 100%);
border-top:1px solid #f0ebfb;
border-bottom:1px solid #f0ebfb;
}

.generator {
max-width:850px;
margin:auto;
padding:28px;
background:white;
border:1px solid var(--line);
border-radius:26px;
box-shadow:var(--shadow);
}

.filters {
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px;
}

label {
display:block;
font-size:12px;
font-weight:800;
margin-bottom:7px;
color:#5f596f;
}

select {
width:100%;
padding:13px;
border:1px solid var(--line);
border-radius:12px;
background:#fdfcff;
color:var(--ink);
outline:none;
}

select:focus {border-color:var(--purple)}

.generate-row {
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-top:18px;
}

.generate-row small {color:var(--muted)}

.results {
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px;
margin-top:22px;
}

.result {
padding:19px;
border-radius:17px;
background:var(--lavender-2);
border:1px solid #e9e2ff;
}

.result .number {
font-size:11px;
color:var(--purple-dark);
font-weight:800;
}

.result h3 {
font-size:17px;
margin:8px 0;
}

.result p {
font-size:13px;
color:#69647a;
margin:0 0 12px;
}

.result button {
border:0;
background:transparent;
color:var(--purple-dark);
font-weight:800;
font-size:12px;
cursor:pointer;
padding:0;
}
</style>
</head>
